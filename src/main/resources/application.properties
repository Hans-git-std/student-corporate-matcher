spring.application.name=student-corporate-matcher
server.port=${SERVER_PORT:8080}

# ===================================================================
# Database Configuration (Pure Git-friendly environment variables)
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===================================================================
# Low-RAM HikariCP Connection Pooling (Optimized for 500MB RAM Server)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Springdoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# Application Security & JWT Properties
# 28-Day Refresh Token Lifespan (2419200000 ms)
# ===================================================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
app.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:2419200000}

# Master Admin Credentials & Recovery
app.security.admin.email=${ADMIN_EMAIL}
app.security.admin.recovery-email=${ADMIN_RECOVERY_EMAIL:hans31144@gmail.com}
app.security.admin.master-password=${ADMIN_PASSWORD}

# Mail Abuse Protection & Free Gmail SMTP Quota Management
app.security.mail.daily-limit=${MAIL_DAILY_LIMIT:400}
app.security.mail.resend-cooldown-seconds=${MAIL_RESEND_COOLDOWN:60}
app.security.mail.max-requests-per-hour-per-email=${MAIL_HOURLY_LIMIT_PER_EMAIL:3}

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ===================================================================
# Real Email Delivery (Dedicated Gmail SMTP)
# ===================================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from-email=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:Student Corporate Matcher Platform}
