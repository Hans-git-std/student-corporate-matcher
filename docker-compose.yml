version: '3.8'

services:
  matcher-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-corporate-matcher-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=${DB_HOST:-gateway01.ap-southeast-1.prod.aws.tidbcloud.com}
      - DB_PORT=${DB_PORT:-4000}
      - DB_NAME=${DB_NAME:-test}
      - DB_USERNAME=${DB_USERNAME:-q3hd9LT3m4krfbn.root}
      - DB_PASSWORD=${DB_PASSWORD:-9DhbOPzviuuR7mYr}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-900000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
